<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenneth Kapstad — Collaboration Graph</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #121212; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; }

#app { display: flex; height: 100vh; }

/* Sidebar */
#sidebar {
  width: 290px; min-width: 290px;
  background: #1e1e1e;
  display: flex; flex-direction: column;
  overflow: hidden;
  border-right: 1px solid #333;
  z-index: 10;
  transition: transform 0.25s ease;
}
#sidebar-header {
  padding: 14px 14px 10px;
  border-bottom: 1px solid #333;
  display: flex; align-items: center; gap: 8px;
}
#sidebar-header h1 { font-size: 15px; font-weight: 600; color: #2ecc71; flex: 1; line-height: 1.2; }
#close-sidebar {
  display: none;
  background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 2px 6px;
  line-height: 1;
}
#sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }

/* Search */
#search-box {
  width: 100%; padding: 7px 10px;
  background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
  color: #e0e0e0; font-size: 13px; outline: none;
  margin-bottom: 8px;
}
#search-box:focus { border-color: #3a7bd5; }
#search-results { list-style: none; margin-bottom: 10px; }
#search-results li {
  padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; color: #ccc;
}
#search-results li:hover { background: #2a3a5a; color: #fff; }

/* Path finder */
.section-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: #888; margin: 10px 0 5px; font-weight: 600;
}
#path-panel { margin-bottom: 8px; }
#path-a, #path-b {
  width: 100%; padding: 6px 8px; background: #2a2a2a; border: 1px solid #444;
  border-radius: 5px; color: #e0e0e0; font-size: 12px; margin-bottom: 4px; outline: none;
}
#path-a:focus, #path-b:focus { border-color: #3a7bd5; }
#path-btn {
  width: 100%; padding: 6px; background: #3a7bd5; border: none; border-radius: 5px;
  color: #fff; font-size: 12px; cursor: pointer; margin-bottom: 4px;
}
#path-btn:hover { background: #2a6bc5; }
#path-clear-btn {
  width: 100%; padding: 6px; background: #333; border: none; border-radius: 5px;
  color: #aaa; font-size: 12px; cursor: pointer;
}
#path-result { font-size: 12px; color: #aaa; margin-top: 4px; min-height: 16px; }

/* Layout options */
#layout-toggle {
  width: 100%; text-align: left; padding: 6px 0; background: none; border: none;
  color: #aaa; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;
}
#layout-toggle:hover { color: #fff; }
#layout-panel { display: none; margin-top: 6px; }
#layout-panel.open { display: block; }
.layout-select {
  width: 100%; padding: 6px 8px; background: #2a2a2a; border: 1px solid #444;
  border-radius: 5px; color: #e0e0e0; font-size: 12px; margin-bottom: 6px; outline: none;
}
.slider-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11px; color: #aaa; }
.slider-row label { width: 90px; flex-shrink: 0; }
.slider-row input[type=range] { flex: 1; accent-color: #3a7bd5; }
.slider-row span { width: 30px; text-align: right; }
#layout-apply-btn {
  width: 100%; padding: 6px; background: #2a4a8a; border: none; border-radius: 5px;
  color: #ccc; font-size: 12px; cursor: pointer;
}
#layout-apply-btn:hover { background: #3a5aaa; }

/* Node info panel */
#info-panel { margin-top: 8px; }
#info-content { font-size: 12px; color: #bbb; line-height: 1.5; }
#info-content h3 { color: #e0e0e0; font-size: 14px; margin-bottom: 4px; }
#info-content .info-albums { margin-top: 6px; }
#info-content .info-album { margin-bottom: 3px; }
#info-content a { color: #3a7bd5; text-decoration: none; }
#info-content a:hover { text-decoration: underline; }
#info-content .role-tag {
  display: inline-block; background: #2a3a5a; color: #8ab4f8;
  padding: 1px 5px; border-radius: 3px; font-size: 10px; margin-left: 3px;
}

/* Stats */
#stats { font-size: 11px; color: #666; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; }

/* Graph area */
#graph-wrap { flex: 1; position: relative; overflow: hidden; }
#cy { width: 100%; height: 100%; background: #121212; }

/* Hamburger */
#hamburger {
  display: none;
  position: absolute; top: 12px; left: 12px; z-index: 20;
  background: #1e1e1e; border: 1px solid #444; border-radius: 6px;
  padding: 6px 10px; font-size: 18px; cursor: pointer; color: #e0e0e0;
  line-height: 1;
}

/* Context menu */
#ctx-menu {
  display: none; position: fixed; z-index: 1000;
  background: #1e1e1e; border: 1px solid #444; border-radius: 7px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  min-width: 180px; padding: 4px 0;
}
.ctx-item {
  padding: 8px 16px; cursor: pointer; font-size: 13px; color: #ccc;
  white-space: nowrap;
}
.ctx-item:hover { background: #2a3a5a; color: #fff; }
.ctx-item.danger { color: #e94560; }
.ctx-item.danger:hover { background: #3a1a2a; }

/* Tooltip for edge hover */
#edge-tooltip {
  display: none; position: fixed; z-index: 999;
  background: #252525; border: 1px solid #444; border-radius: 5px;
  padding: 6px 10px; font-size: 12px; color: #ccc;
  pointer-events: none; max-width: 280px;
}

/* Mobile */
@media (max-width: 767px) {
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 290px; transform: translateX(-100%);
    z-index: 100;
  }
  #sidebar.open { transform: translateX(0); }
  #close-sidebar { display: block; }
  #hamburger { display: block; }
}
@media (max-width: 399px) {
  #sidebar { width: 100%; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Kenneth Kapstad<br><span style="font-weight:400;color:#888;font-size:12px">Collaboration Graph</span></h1>
      <button id="close-sidebar" aria-label="Close sidebar">×</button>
    </div>
    <div id="sidebar-content">
      <input type="search" id="search-box" placeholder="Search musicians…" autocomplete="off">
      <ul id="search-results"></ul>

      <div class="section-label">Find Path</div>
      <div id="path-panel">
        <input id="path-a" type="text" placeholder="Artist A (click node or type)">
        <input id="path-b" type="text" placeholder="Artist B (click node or type)">
        <button id="path-btn">Find shortest path</button>
        <button id="path-clear-btn">Clear path</button>
        <div id="path-result"></div>
      </div>

      <div class="section-label">Layout</div>
      <button id="layout-toggle">▶ Layout options</button>
      <div id="layout-panel">
        <select class="layout-select" id="layout-select">
          <option value="cose">CoSE (force-directed)</option>
          <option value="breadthfirst">Breadth-first</option>
          <option value="concentric">Concentric</option>
          <option value="circle">Circle</option>
          <option value="grid">Grid</option>
        </select>
        <div class="slider-row">
          <label>Node spacing</label>
          <input type="range" id="sl-spacing" min="10" max="200" value="80">
          <span id="sl-spacing-val">80</span>
        </div>
        <div class="slider-row">
          <label>Edge length</label>
          <input type="range" id="sl-edgelen" min="50" max="400" value="150">
          <span id="sl-edgelen-val">150</span>
        </div>
        <button id="layout-apply-btn">Apply layout</button>
      </div>

      <div class="section-label">Node info</div>
      <div id="info-panel">
        <div id="info-content" style="color:#555">Click a node to see details</div>
      </div>

      <div id="stats"></div>
    </div>
  </div>

  <div id="graph-wrap">
    <button id="hamburger" aria-label="Open sidebar">☰</button>
    <div id="cy"></div>
  </div>
</div>

<div id="ctx-menu"></div>
<div id="edge-tooltip"></div>

// ── Helpers ────────────────────────────────────────────────────────────────
const CENTER = DATA.center;
const HOP1_SET = new Set(DATA.hop1);

function nodeHop(id) {
  if (id === CENTER) return 0;
  if (HOP1_SET.has(id)) return 1;
  return 2;
}

function nodeName(id) {
  return DATA.nodes[id] ? DATA.nodes[id].name : id;
}

function edgeWidth(weight) {
  if (weight >= 10) return 5;
  if (weight >= 5) return 3.5;
  if (weight >= 3) return 2.5;
  if (weight >= 2) return 1.8;
  return 1.2;
}

// Compute degree for visible nodes
function computeDegrees(nodeIds) {
  const deg = {};
  for (const id of nodeIds) deg[id] = 0;
  const adj = DATA.adjacency;
  for (const id of nodeIds) {
    if (!adj[id]) continue;
    for (const [nbr] of adj[id]) {
      if (deg.hasOwnProperty(nbr)) deg[id]++;
    }
  }
  return deg;
}

function degreeToSize(deg, minDeg, maxDeg) {
  const span = Math.max(maxDeg - minDeg, 1);
  return 28 + Math.round(((deg - minDeg) / span) * 40);
}

// ── Build initial elements ─────────────────────────────────────────────────
function buildElements(visibleIds) {
  const vis = new Set(visibleIds);
  const degrees = computeDegrees([...vis]);
  const degValues = Object.values(degrees);
  const minDeg = Math.min(...degValues);
  const maxDeg = Math.max(...degValues);

  const elements = [];

  for (const id of vis) {
    const node = DATA.nodes[id];
    const hop = nodeHop(id);
    elements.push({
      group: 'nodes',
      data: {
        id,
        label: node ? node.name : id,
        hop,
        size: degreeToSize(degrees[id] || 0, minDeg, maxDeg),
        degree: degrees[id] || 0
      }
    });
  }

  // Edges: only between visible pairs
  const added = new Set();
  for (const a of vis) {
    const adj = DATA.adjacency[a];
    if (!adj) continue;
    for (const [b, weight, albumIds] of adj) {
      if (!vis.has(b)) continue;
      const key = [a, b].sort().join('|');
      if (added.has(key)) continue;
      added.add(key);
      elements.push({
        group: 'edges',
        data: {
          id: 'e|' + key,
          source: a,
          target: b,
          weight,
          albumIds,
          width: edgeWidth(weight)
        }
      });
    }
  }
  return elements;
}

// ── Init Cytoscape ─────────────────────────────────────────────────────────
const initialIds = [CENTER, ...DATA.hop1];
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: buildElements(initialIds),
  style: CY_STYLE,
  layout: {
    name: 'cose',
    animate: false,
    randomize: true,
    nodeRepulsion: 8000,
    idealEdgeLength: 150,
    nodeOverlap: 20,
    padding: 40
  },
  minZoom: 0.05,
  maxZoom: 4
});

// Update stats
function updateStats() {
  document.getElementById('stats').textContent =
    `${cy.nodes().length} artists · ${cy.edges().length} connections`;
}
updateStats();

// ── Track visible set ──────────────────────────────────────────────────────
let visibleSet = new Set(initialIds);

function refreshEdges() {
  // Remove edges between nodes not both visible, add new ones
  cy.edges().remove();
  const added = new Set();
  for (const a of visibleSet) {
    const adj = DATA.adjacency[a];
    if (!adj) continue;
    for (const [b, weight, albumIds] of adj) {
      if (!visibleSet.has(b)) continue;
      const key = [a, b].sort().join('|');
      if (added.has(key)) continue;
      added.add(key);
      cy.add({
        group: 'edges',
        data: {
          id: 'e|' + key,
          source: a,
          target: b,
          weight,
          albumIds,
          width: edgeWidth(weight)
        }
      });
    }
  }
}

function refreshNodeSizes() {
  const ids = [...visibleSet];
  const degrees = computeDegrees(ids);
  const degValues = Object.values(degrees);
  const minDeg = Math.min(...degValues);
  const maxDeg = Math.max(...degValues);
  cy.nodes().forEach(n => {
    const d = degrees[n.id()] || 0;
    const sz = degreeToSize(d, minDeg, maxDeg);
    n.data('size', sz);
    n.data('degree', d);
  });
}

// ── Layout ────────────────────────────────────────────────────────────────
let currentLayout = 'cose';
let layoutParams = { spacing: 80, edgelen: 150 };

function runLayout(name, params) {
  const opts = { animate: false, padding: 40, fit: true };
  if (name === 'cose') {
    Object.assign(opts, {
      name: 'cose',
      randomize: false,
      nodeRepulsion: 4000 + params.spacing * 50,
      idealEdgeLength: params.edgelen,
      nodeOverlap: 20
    });
  } else if (name === 'breadthfirst') {
    Object.assign(opts, {
      name: 'breadthfirst',
      roots: [CENTER],
      spacingFactor: 1 + params.spacing / 100
    });
  } else if (name === 'concentric') {
    Object.assign(opts, {
      name: 'concentric',
      levelWidth: () => 1,
      concentric: n => n.id() === CENTER ? 3 : (HOP1_SET.has(n.id()) ? 2 : 1),
      spacingFactor: 1 + params.spacing / 100
    });
  } else {
    Object.assign(opts, { name, spacingFactor: 1 + params.spacing / 100 });
  }
  cy.layout(opts).run();
}

// ── Expand / collapse ─────────────────────────────────────────────────────
function expandNeighbors(nodeId) {
  const hop2List = DATA.hop2_per_hop1[nodeId] || [];
  // also find any visible node's neighbors that include nodeId
  const newIds = [];
  for (const id of hop2List) {
    if (!visibleSet.has(id) && DATA.nodes[id]) {
      newIds.push(id);
    }
  }
  // also expand if nodeId is a hop-2 node: find its hop-1 neighbors' hop2 lists
  // but the hop2_per_hop1 only has hop1->hop2 mapping, so above covers it.

  if (newIds.length === 0) return;

  // Position new nodes in a ring around the expanded node
  const srcNode = cy.getElementById(nodeId);
  const pos = srcNode.position();
  const count = newIds.length;
  for (let i = 0; i < count; i++) {
    const id = newIds[i];
    visibleSet.add(id);
    const nd = DATA.nodes[id];
    const angle = (2 * Math.PI * i) / count - Math.PI / 2;
    const r = 160 + Math.random() * 40;
    cy.add({
      group: 'nodes',
      data: { id, label: nd.name, hop: 2, size: 28, degree: 0 },
      position: { x: pos.x + Math.cos(angle) * r, y: pos.y + Math.sin(angle) * r }
    });
  }
  refreshEdges();
  refreshNodeSizes();
  updateStats();

  // Mark the expanded node so user can find it
  srcNode.addClass('just-expanded');
  setTimeout(() => srcNode.removeClass('just-expanded'), 3000);
}

function collapseNeighbors(nodeId) {
  // Remove neighbors that have no other connections to still-visible nodes besides nodeId
  const adj = DATA.adjacency[nodeId];
  if (!adj) return;

  const neighbors = adj.map(([b]) => b).filter(b => visibleSet.has(b));
  const toRemove = [];

  for (const nbr of neighbors) {
    if (nbr === CENTER) continue;  // never remove center
    // Count connections to visible nodes besides nodeId
    const nbrAdj = DATA.adjacency[nbr] || [];
    const otherConns = nbrAdj.filter(([b]) => b !== nodeId && visibleSet.has(b));
    if (otherConns.length === 0) toRemove.push(nbr);
  }

  if (toRemove.length === 0) return;
  for (const id of toRemove) {
    visibleSet.delete(id);
    cy.getElementById(id).remove();
  }
  refreshEdges();
  refreshNodeSizes();
  updateStats();
}

// ── Highlight neighborhood (double-click) ─────────────────────────────────
let highlightedNode = null;

function highlightNeighborhood(nodeId) {
  if (highlightedNode === nodeId) {
    // Clear
    cy.elements().removeClass('dimmed highlighted');
    highlightedNode = null;
    return;
  }
  highlightedNode = nodeId;
  const node = cy.getElementById(nodeId);
  const directEdges = node.connectedEdges();
  const directNeighbors = directEdges.connectedNodes();
  cy.elements().addClass('dimmed');
  node.removeClass('dimmed');
  directNeighbors.removeClass('dimmed');
  directEdges.removeClass('dimmed').addClass('highlighted');
}

// ── Path finding (BFS over visible nodes) ─────────────────────────────────
let pathSelA = null, pathSelB = null;
let pathNodes = new Set(), pathEdges = new Set();

function bfsPath(startId, endId) {
  if (startId === endId) return [startId];
  const queue = [[startId]];
  const visited = new Set([startId]);
  const adj = DATA.adjacency;
  while (queue.length) {
    const path = queue.shift();
    const cur = path[path.length - 1];
    const neighbors = (adj[cur] || []).map(([b]) => b).filter(b => visibleSet.has(b));
    for (const nbr of neighbors) {
      if (visited.has(nbr)) continue;
      visited.add(nbr);
      const newPath = [...path, nbr];
      if (nbr === endId) return newPath;
      queue.push(newPath);
    }
  }
  return null;
}

function showPath(pathIds) {
  clearPath();
  if (!pathIds || pathIds.length < 2) return;
  pathNodes = new Set(pathIds);
  // Highlight path nodes
  for (const id of pathIds) {
    cy.getElementById(id).addClass('path-node');
  }
  // Highlight edges
  for (let i = 0; i < pathIds.length - 1; i++) {
    const a = pathIds[i], b = pathIds[i + 1];
    const key = [a, b].sort().join('|');
    const edge = cy.getElementById('e|' + key);
    if (edge) edge.addClass('path-edge');
  }
}

function clearPath() {
  cy.elements().removeClass('path-node path-edge');
  pathNodes = new Set();
  pathEdges = new Set();
}

// ── Node info panel ────────────────────────────────────────────────────────
function showNodeInfo(nodeId) {
  const nd = DATA.nodes[nodeId];
  if (!nd) return;
  const albums = nd.a || [];
  // Sort by year
  const sortedAlbums = albums
    .map(([aid, roles]) => {
      const alb = DATA.albums[aid] || {};
      return { aid, roles, name: alb.n || aid, year: alb.y || '', mbUrl: alb.u || '' };
    })
    .sort((a, b) => (a.year || '9999').localeCompare(b.year || '9999'));

  let html = `<h3>${escHtml(nd.name)}</h3>`;
  if (nd.u) html += `<div style="margin-bottom:6px"><a href="${nd.u}" target="_blank" rel="noopener">Open on MusicBrainz ↗</a></div>`;

  const adjEntry = DATA.adjacency[nodeId] || [];
  const visNeighbors = adjEntry.filter(([b]) => visibleSet.has(b));
  html += `<div style="color:#888;margin-bottom:6px">${visNeighbors.length} visible connections · ${albums.length} shared albums</div>`;

  if (sortedAlbums.length) {
    html += '<div class="info-albums">';
    for (const { name, year, mbUrl, roles } of sortedAlbums) {
      const roleHtml = roles.map(r => `<span class="role-tag">${escHtml(r)}</span>`).join('');
      const yearStr = year ? `<span style="color:#666">${year}</span> ` : '';
      const link = mbUrl ? `<a href="${mbUrl}" target="_blank" rel="noopener">${escHtml(name)}</a>` : escHtml(name);
      html += `<div class="info-album">${yearStr}${link}${roleHtml}</div>`;
    }
    html += '</div>';
  }
  document.getElementById('info-content').innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Context menu ──────────────────────────────────────────────────────────
const ctxMenu = document.getElementById('ctx-menu');
let ctxTarget = null;

function showCtxMenu(x, y, nodeId) {
  ctxTarget = nodeId;
  const nd = DATA.nodes[nodeId];
  const name = nd ? nd.name : nodeId;

  let items = [];

  // Expand neighbors
  const hop2 = DATA.hop2_per_hop1[nodeId] || [];
  const expandable = hop2.filter(id => !visibleSet.has(id));
  if (expandable.length > 0) {
    items.push({ label: `Expand neighbors (+${expandable.length})`, action: () => expandNeighbors(nodeId) });
  }

  // Collapse neighbors
  const adj = DATA.adjacency[nodeId] || [];
  const collapsible = adj.map(([b]) => b).filter(b => {
    if (!visibleSet.has(b) || b === CENTER) return false;
    const nbrAdj = DATA.adjacency[b] || [];
    return nbrAdj.filter(([c]) => c !== nodeId && visibleSet.has(c)).length === 0;
  });
  if (collapsible.length > 0) {
    items.push({ label: `Collapse neighbors (−${collapsible.length})`, action: () => collapseNeighbors(nodeId) });
  }

  // Path selection
  if (pathSelA === nodeId || pathSelB === nodeId) {
    items.push({ label: 'Deselect for path', action: () => {
      if (pathSelA === nodeId) pathSelA = null;
      if (pathSelB === nodeId) pathSelB = null;
      cy.getElementById(nodeId).removeClass('selected-path');
      syncPathInputs();
    }});
  } else {
    items.push({ label: 'Select for path', action: () => {
      if (!pathSelA) {
        pathSelA = nodeId;
        document.getElementById('path-a').value = name;
      } else if (!pathSelB) {
        pathSelB = nodeId;
        document.getElementById('path-b').value = name;
      } else {
        // replace B, shift old B to A
        cy.getElementById(pathSelA).removeClass('selected-path');
        pathSelA = pathSelB;
        document.getElementById('path-a').value = nodeName(pathSelA);
        pathSelB = nodeId;
        document.getElementById('path-b').value = name;
      }
      cy.getElementById(nodeId).addClass('selected-path');
      syncPathInputs();
    }});
  }

  // MusicBrainz link
  if (nd && nd.u) {
    items.push({ label: 'Open on MusicBrainz ↗', action: () => window.open(nd.u, '_blank', 'noopener') });
  }

  ctxMenu.innerHTML = items.map((item, i) =>
    `<div class="ctx-item" data-i="${i}">${escHtml(item.label)}</div>`
  ).join('');

  ctxMenu._items = items;

  // Position: keep within viewport
  ctxMenu.style.display = 'block';
  const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  ctxMenu.style.left = (Math.min(x, vw - mw - 8)) + 'px';
  ctxMenu.style.top = (Math.min(y, vh - mh - 8)) + 'px';
}

function hideCtxMenu() {
  ctxMenu.style.display = 'none';
  ctxTarget = null;
}

ctxMenu.addEventListener('click', e => {
  const item = e.target.closest('.ctx-item');
  if (!item) return;
  const i = parseInt(item.dataset.i, 10);
  if (ctxMenu._items && ctxMenu._items[i]) {
    ctxMenu._items[i].action();
  }
  hideCtxMenu();
});

document.addEventListener('click', e => {
  if (!ctxMenu.contains(e.target)) hideCtxMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideCtxMenu(); clearDim(); }
});

function clearDim() {
  cy.elements().removeClass('dimmed highlighted');
  highlightedNode = null;
}

// ── Cytoscape event handlers ───────────────────────────────────────────────
// Right-click / cxttap
cy.on('cxttap', 'node', e => {
  e.preventDefault();
  const pos = e.renderedPosition || e.position;
  const rect = document.getElementById('cy').getBoundingClientRect();
  showCtxMenu(rect.left + pos.x, rect.top + pos.y, e.target.id());
});

// Double-click (double tap on mobile handled separately)
let lastTap = 0, lastTapNode = null;
cy.on('tap', 'node', e => {
  const now = Date.now();
  const id = e.target.id();
  if (now - lastTap < 400 && lastTapNode === id) {
    // double tap
    highlightNeighborhood(id);
    lastTap = 0; lastTapNode = null;
    return;
  }
  lastTap = now; lastTapNode = id;
  // single tap: show info
  showNodeInfo(id);
});

// Edge hover tooltip
const edgeTip = document.getElementById('edge-tooltip');
cy.on('mouseover', 'edge', e => {
  const d = e.target.data();
  const albums = (d.albumIds || []).map(aid => {
    const alb = DATA.albums[aid];
    return alb ? `${alb.n}${alb.y ? ' (' + alb.y + ')' : ''}` : aid;
  });
  edgeTip.textContent = `${d.weight} shared album${d.weight > 1 ? 's' : ''}: ${albums.slice(0, 5).join(', ')}${albums.length > 5 ? '…' : ''}`;
  edgeTip.style.display = 'block';
});
cy.on('mousemove', 'edge', e => {
  edgeTip.style.left = (e.originalEvent.clientX + 14) + 'px';
  edgeTip.style.top = (e.originalEvent.clientY + 10) + 'px';
});
cy.on('mouseout', 'edge', () => { edgeTip.style.display = 'none'; });

// Background click: clear
cy.on('tap', e => {
  if (e.target === cy) {
    clearDim();
    document.getElementById('info-content').innerHTML = '<span style="color:#555">Click a node to see details</span>';
  }
});

// ── Long-press (mobile context menu) ─────────────────────────────────────
let longPressTimer = null;
let touchMoved = false;

cy.on('touchstart', 'node', e => {
  touchMoved = false;
  const tgt = e.target;
  const oe = e.originalEvent;
  const touch = oe.touches[0];
  longPressTimer = setTimeout(() => {
    if (!touchMoved) {
      const rect = document.getElementById('cy').getBoundingClientRect();
      showCtxMenu(touch.clientX, touch.clientY, tgt.id());
    }
  }, 500);
});
cy.on('touchmove', () => {
  touchMoved = true;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
});
cy.on('touchend', () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
});

// ── Search ────────────────────────────────────────────────────────────────
const searchBox = document.getElementById('search-box');
const searchResults = document.getElementById('search-results');

function buildSearchIndex() {
  return Object.entries(DATA.nodes).map(([id, nd]) => ({
    id, name: nd.name, nameLower: nd.name.toLowerCase()
  }));
}
const searchIndex = buildSearchIndex();

searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (!q) return;

  const matches = searchIndex
    .filter(n => n.nameLower.includes(q))
    .sort((a, b) => {
      const ai = a.nameLower.indexOf(q), bi = b.nameLower.indexOf(q);
      return ai - bi || a.name.localeCompare(b.name);
    })
    .slice(0, 12);

  for (const m of matches) {
    const li = document.createElement('li');
    li.textContent = m.name;
    li.style.opacity = visibleSet.has(m.id) ? '1' : '0.5';
    li.addEventListener('click', () => {
      centerOnNode(m.id);
      searchResults.innerHTML = '';
      searchBox.value = '';
    });
    searchResults.appendChild(li);
  }
});

function centerOnNode(id) {
  if (!visibleSet.has(id)) {
    // Try to make it visible by expanding relevant hop-1 node
    // Find a hop-1 node that has this id in its hop2 list
    for (const [h1, h2list] of Object.entries(DATA.hop2_per_hop1)) {
      if (h2list.includes(id) && visibleSet.has(h1)) {
        expandNeighbors(h1);
        break;
      }
    }
  }
  if (!visibleSet.has(id)) return;

  const node = cy.getElementById(id);
  if (node.length === 0) return;
  cy.animate({ zoom: 1.5, center: { eles: node } }, { duration: 400 });
  showNodeInfo(id);
}

// ── Path UI ───────────────────────────────────────────────────────────────
function syncPathInputs() {
  document.getElementById('path-a').value = pathSelA ? nodeName(pathSelA) : '';
  document.getElementById('path-b').value = pathSelB ? nodeName(pathSelB) : '';
}

document.getElementById('path-btn').addEventListener('click', () => {
  const aId = pathSelA, bId = pathSelB;
  const aVal = document.getElementById('path-a').value.trim();
  const bVal = document.getElementById('path-b').value.trim();

  // If IDs not set, try to find by name
  function findId(name) {
    const lower = name.toLowerCase();
    const m = searchIndex.find(n => n.nameLower === lower);
    return m ? m.id : null;
  }

  const startId = aId || findId(aVal);
  const endId = bId || findId(bVal);

  if (!startId || !endId) {
    document.getElementById('path-result').textContent = 'Could not find one or both artists.';
    return;
  }

  const path = bfsPath(startId, endId);
  const resultEl = document.getElementById('path-result');
  if (!path) {
    resultEl.textContent = 'No path found between visible nodes.';
    clearPath();
  } else {
    resultEl.textContent = `Path (${path.length - 1} hop${path.length > 2 ? 's' : ''}): ${path.map(nodeName).join(' → ')}`;
    showPath(path);
  }
});

document.getElementById('path-clear-btn').addEventListener('click', () => {
  clearPath();
  pathSelA = null; pathSelB = null;
  syncPathInputs();
  cy.elements().removeClass('selected-path');
  document.getElementById('path-result').textContent = '';
});

// ── Layout controls ───────────────────────────────────────────────────────
document.getElementById('layout-toggle').addEventListener('click', () => {
  const panel = document.getElementById('layout-panel');
  const btn = document.getElementById('layout-toggle');
  panel.classList.toggle('open');
  btn.textContent = (panel.classList.contains('open') ? '▼' : '▶') + ' Layout options';
});

function makeSlider(id, valId) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  sl.addEventListener('input', () => { vl.textContent = sl.value; });
}
makeSlider('sl-spacing', 'sl-spacing-val');
makeSlider('sl-edgelen', 'sl-edgelen-val');

document.getElementById('layout-apply-btn').addEventListener('click', () => {
  currentLayout = document.getElementById('layout-select').value;
  layoutParams = {
    spacing: parseInt(document.getElementById('sl-spacing').value, 10),
    edgelen: parseInt(document.getElementById('sl-edgelen').value, 10)
  };
  runLayout(currentLayout, layoutParams);
});

// ── Sidebar / hamburger ───────────────────────────────────────────────────
document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('close-sidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
});

// ── Initial info ──────────────────────────────────────────────────────────
showNodeInfo(CENTER);

})();
</script>
</body>
